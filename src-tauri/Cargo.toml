[package]
name = "codinglab"
version = "0.9.0"
description = "CodingLab – HTL Villach"
authors = ["Sitter Max", "Rechberger Simon"]
edition = "2024"

[lib]
name = "codinglab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
